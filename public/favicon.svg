<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E978A" />
      <stop offset="100%" stop-color="#0D645B" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Crisp full-bleed rounded badge -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#tealBg)" />

  <!-- Subtle Rub el Hizb (8-point Islamic star) framing -->
  <g stroke="url(#goldAccent)" stroke-width="3" stroke-opacity="0.32" fill="none">
    <rect x="24" y="24" width="80" height="80" rx="8" />
    <rect x="24" y="24" width="80" height="80" rx="8" transform="rotate(45 64 64)" />
  </g>

  <!-- Top radiant 4-point star accent -->
  <path
    d="M64 17 L68 25 L76 29 L68 33 L64 41 L60 33 L52 29 L60 25 Z"
    fill="url(#goldAccent)"
  />

  <!-- Bold open Mushaf pages (high-contrast for 16x16 browser tabs) -->
  <path
    d="M64 48 C51 41 34 41 23 46 L23 87 C34 82 51 82 64 89 Z"
    fill="#FFFFFF"
  />
  <path
    d="M64 48 C77 41 94 41 105 46 L105 87 C94 82 77 82 64 89 Z"
    fill="#E2E8F0"
  />

  <!-- Crisp center spine -->
  <line x1="64" y1="48" x2="64" y2="89" stroke="#0F766E" stroke-width="3.5" stroke-linecap="round" />

  <!-- Warm gold book cover / Rahal cradle -->
  <path
    d="M19 91 C34 85 51 87 64 95 C77 87 94 85 109 91"
    fill="none"
    stroke="url(#goldAccent)"
    stroke-width="6.5"
    stroke-linecap="round"
  />
</svg>
